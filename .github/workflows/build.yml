name: Build firmware

permissions:
  contents: read

on:
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "build_support/**"
      - "rogue-radar/**"
      - "tests/**"
      - "User_Setups/**"
      - "lv_conf.h"
      - "platformio.ini"
  push:
    paths:
      - ".github/workflows/build.yml"
      - "build_support/**"
      - "rogue-radar/**"
      - "tests/**"
      - "User_Setups/**"
      - "lv_conf.h"
      - "platformio.ini"

jobs:
  platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Signal tracker host tests
        run: sh tests/run_host_tests.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Compile original and T-Embed CC1101 profiles
        run: pio run -e original -e t_embed_cc1101
